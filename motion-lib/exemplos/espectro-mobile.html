<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espectrosint Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
/* motion-lib · Espectrosint, versão vertical 1080x1920 do demo (mesma história do espectro.html)
 * Layout = CSS mobile de produção do dashboard.html.j2 (@media 768/560/480): topo com logo e menu,
 * abas em grade de 4 colunas, campo e botão empilhados, cards numa coluna só. Viewport de 430 px
 * (celular grande), sem moldura de aparelho desenhada (hallmark gate 47). Toque no lugar do cursor.
 * Mesma linha do tempo T do 16:9: a cama de som (acordes nos tempos de T) serve às duas versões.
 * Estado de demonstração: o e-mail usa o domínio reservado example.com; nomes, números dos cards,
 * vazamentos e a senha mascarada são ilustrativos ("illustrative example" na tela).
 * A varredura mostra o roster real de e-mail (37 checkers). Cores das plataformas = brandColors do dashboard.
 */
:root {
  --night: #070708;
  --bg: #0e0e10;
  --surface: #1c1c1f;
  --surface2: #26262b;
  --surface3: #323239;
  --text: #ececec;
  --text2: #bcbcbc;
  --text3: #b3b3b3;
  --text4: #a6a6a6;
  --border: #2e2e33;
  --border2: #3d3d42;
  --found: #84cc16;
  --found-rgb: 132, 204, 22;
  --danger: #ef4444;
  --danger-rgb: 239, 68, 68;
  --breach-bg: #1e1c1f;
  --white: #ffffff;
  --ink: #000000;
  --grid: rgba(255, 255, 255, 0.022);
  --fd: 'Geist', -apple-system, system-ui, sans-serif;
  --fb: 'Geist', -apple-system, system-ui, sans-serif;
  --fm: 'IBM Plex Mono', ui-monospace, monospace;
  --shadow-elev-1: 0 1px 2px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.15);
  --shadow-elev-2: 0 1px 2px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.2), 0 16px 32px rgba(0,0,0,0.12);
  --blob: radial-gradient(ellipse 40% 30% at 15% 20%, rgba(255,255,255,0.08), transparent 70%), radial-gradient(ellipse 35% 45% at 80% 30%, rgba(0,0,0,0.55), transparent 70%), radial-gradient(ellipse 45% 25% at 45% 75%, rgba(255,255,255,0.06), transparent 70%), radial-gradient(ellipse 30% 40% at 25% 85%, rgba(0,0,0,0.5), transparent 70%), radial-gradient(ellipse 25% 35% at 85% 85%, rgba(255,255,255,0.07), transparent 70%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: clip; background: #000; }
.stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: var(--night); font-family: var(--fb); color: var(--text); -webkit-font-smoothing: antialiased; font-kerning: normal; }
.glow { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(160px); }
#glowA { width: 1000px; height: 1300px; background: var(--found); }
#glowB { width: 900px; height: 1100px; background: var(--white); }
#world { position: absolute; inset: 0; }
#cam { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 540px 960px; }
#win, #pop { position: absolute; left: 0; top: 0; width: 430px; height: 764px; transform-origin: 0 0; }
#pop { transform-style: preserve-3d; }
#winBg { position: absolute; inset: 0; border-radius: 26px; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 46px 46px; border: 1px solid var(--border2); box-shadow: 0 50px 140px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.025); }
#main { position: absolute; inset: 0; overflow: hidden; border-radius: 26px; }
#content { position: absolute; left: 0; top: 0; width: 430px; height: 6400px; }
#dim { position: absolute; inset: 0; background: var(--night); opacity: 0; }
#sheen { position: absolute; inset: 0; border-radius: 26px; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.05) 47%, rgba(255, 255, 255, 0.015) 53%, transparent 62%); background-size: 260% 100%; pointer-events: none; }
.w { display: inline-block; white-space: pre; }
svg { display: block; }

/* ---------- topo do celular (.mobile-topbar) */
#topbar { position: absolute; left: 0; top: 0; width: 430px; height: 60.4px; padding: 14.4px 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
#topbarBg { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14, 14, 16, 0.96), rgba(14, 14, 16, 0.84)); }
#mtBrand { position: relative; display: flex; align-items: center; gap: 12px; min-width: 0; }
#mtLogo { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--text); }
#mtLogo svg { width: 34px; height: 31px; }
.mt-name { font: 700 16px/1 var(--fd); letter-spacing: -0.03em; white-space: nowrap; color: var(--text); }
.mt-name span { color: var(--found); }
#mtMenu { position: relative; width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.04); color: var(--text); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18); flex-shrink: 0; }
#mtMenu svg { width: 18px; height: 18px; }
#chat { position: absolute; left: 354px; top: 688px; width: 56px; height: 56px; border-radius: 50%; background: var(--found); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 26px rgba(var(--found-rgb), 0.28); color: var(--bg); }
#chat svg { width: 24px; height: 24px; }

/* ---------- busca (.search-section no celular) */
#sec { position: absolute; left: 0; top: 60.4px; width: 430px; padding: 20px 16px 24px; text-align: center; }
#greet { height: 36px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 12px; }
#ghost { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
#ghost svg { width: 36px; height: 33px; }
.search-title { font-family: var(--fd); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25; color: var(--text); white-space: nowrap; }
#sub p { font-size: 14px; line-height: 1.55; color: var(--text3); max-width: 32ch; margin: 0 auto 18px; }
#tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; padding: 6px; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.tab { position: relative; min-height: 48px; padding: 9px 3px; color: var(--text3); font: 600 10px/1.2 var(--fd); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 1px solid transparent; }
.tab svg { width: 14px; height: 14px; position: relative; }
.tab span { position: relative; white-space: nowrap; }
.tab .tab-on { position: absolute; inset: -1px; border-radius: 10px; background: var(--found); opacity: 0; }
#srow { display: flex; flex-direction: column; gap: 12px; }
.search-field { position: relative; height: 60px; padding: 0 16px; background: rgba(255, 255, 255, 0.025); border: 1px solid var(--border); border-radius: 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
.search-field > svg { width: 18px; height: 18px; color: var(--text4); flex-shrink: 0; }
.q { position: relative; flex: 1; height: 24px; font: 400 16px/24px var(--fb); color: var(--text); white-space: pre; }
.ph { position: absolute; left: 0; top: 0; color: var(--text4); }
#typed { position: absolute; left: 0; top: 0; white-space: pre; }
#typed span { display: inline-block; white-space: pre; }
#caret { position: absolute; left: 0; top: 2px; width: 1.6px; height: 20px; background: var(--text); }
.search-btn { position: relative; width: 100%; height: 56px; border-radius: 14px; background: var(--found); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(var(--found-rgb), 0.18); }
.search-btn svg { width: 20px; height: 20px; }
#goRing { position: absolute; inset: 0; border-radius: 14px; border: 2px solid rgba(var(--found-rgb), 0.9); opacity: 0; }
#terms { margin-top: 14px; font-size: 12px; line-height: 1.5; color: var(--text4); }
#terms a { color: var(--text3); text-decoration: underline; text-underline-offset: 3px; }
#deepRow { margin-top: 4px; }
#deep { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 999px; color: var(--text3); font: 500 12px/1 var(--fd); white-space: nowrap; }
#deep > svg { width: 14px; height: 14px; }
.toggle-dot { position: relative; width: 36px; height: 22px; border-radius: 999px; background: var(--surface3); border: 1px solid var(--border2); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3); }
.toggle-knob { position: absolute; left: 1px; top: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.18); }

/* ---------- resultados (.results-section no celular) */
#loading { position: absolute; left: 16px; width: 398px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; line-height: 20px; color: var(--text2); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--text4); border-top-color: var(--text); border-radius: 50%; }
.loading-progress { font-variant-numeric: tabular-nums; font-size: 13px; line-height: 18px; color: var(--text3); }
.loading-progress b { color: var(--found); font-weight: 600; }
#reshead { position: absolute; left: 16px; width: 398px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.results-query { width: 100%; font-family: var(--fm); font-size: 14px; line-height: 20px; color: var(--text); padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; word-break: break-all; }
.results-time { font-family: var(--fm); font-size: 13px; line-height: 18px; color: var(--text4); }
#wallWrap { position: absolute; left: 0; width: 430px; perspective: 1000px; }
#wall { position: absolute; top: 0; transform-origin: 50% 50%; }
.wpill { position: absolute; left: 0; top: 0; }
#beam { position: absolute; left: -40px; top: 0; height: 3px; border-radius: 2px; background: var(--found); box-shadow: 0 0 22px 6px rgba(var(--found-rgb), 0.55), 0 0 70px 18px rgba(var(--found-rgb), 0.18); }
#beamTrail { position: absolute; left: -40px; top: 0; height: 240px; background: linear-gradient(180deg, transparent, rgba(var(--found-rgb), 0.10)); }
#panel { position: absolute; left: 16px; width: 398px; background: rgba(255, 255, 255, 0.022); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow-elev-2); }
#panelBox { position: absolute; inset: -1px; border-radius: 14px; }
.sources-header { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sources-title { font: 700 13px/1 var(--fd); color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
.sources-count { font: 600 14px/1 var(--fm); color: var(--text); background: var(--surface2); padding: 6px 12px; border-radius: 6px; min-width: 40px; text-align: center; }
.sources-grid { position: relative; display: flex; flex-wrap: wrap; gap: 8px; }
.source-pill { height: 38px; padding: 0 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font: 600 12px/1 var(--fd); color: var(--text2); text-transform: capitalize; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.source-pill img { width: 18px; height: 18px; border-radius: 4px; }
.source-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
#flyers { position: absolute; left: 0; top: 0; }
.flyer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#cards { position: absolute; left: 0; top: 0; }

/* ---------- cards (classes do dashboard + overrides do @media 768/560) */
.card { position: absolute; width: 398px; background-color: rgba(255, 255, 255, 0.025); background-image: var(--blob); background-size: 200% 200%; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-elev-1); }
.card.breach-card { background-color: var(--breach-bg); }
.card.leak-card { border-color: rgba(220, 38, 38, 0.55); box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.22), 0 8px 28px rgba(220, 38, 38, 0.10); }
.card-header { display: flex; align-items: center; gap: 12px; padding: 22px 16px 16px; border-left: 3px solid transparent; }
.card-icon-img { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; object-fit: contain; }
.card-icon-fallback { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-platform { flex: 1; }
.card-platform-name { font: 700 21px/1.2 var(--fd); letter-spacing: -0.015em; }
.card-platform-cat { margin-top: 7px; color: var(--text3); font-size: 15px; line-height: 1.4; }
.card-idx { align-self: flex-start; color: var(--text3); font: 600 12px/1.4 var(--fd); letter-spacing: 0.1em; }
.card-avatar-area { padding: 4px 16px 18px; display: flex; align-items: center; gap: 20px; }
.card-avatar { width: 120px; height: 120px; border-radius: 12px; background: var(--surface2); border: 2px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-avatar svg { width: 100%; height: 100%; }
.card-avatar-placeholder { font: 700 40px/1 var(--fd); }
.card-avatar-info { flex: 1; }
.card-avatar-name { font: 700 20px/1.3 var(--fd); letter-spacing: -0.02em; margin-bottom: 3px; }
.card-avatar-handle { font: 400 14px/1.4 var(--fm); color: var(--text2); }
.card-body { padding: 0 0 6px; }
.card-row { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 15px 16px; border-top: 1px solid var(--border); }
.card-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; line-height: 1.4; color: var(--text3); }
.card-value { font-size: 16px; font-weight: 500; color: var(--text); line-height: 1.4; font-variant-numeric: tabular-nums; }
.card-value u { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--text4); }
.card-link-area { padding: 12px 28px 24px; }
.card-open-link { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; background: var(--text); border-radius: 14px; font: 700 15px/1 var(--fd); color: var(--bg); letter-spacing: 0.01em; }
.card-open-link svg { width: 16px; height: 16px; }
.cti-fields { color: var(--text); font: 700 16px/1.4 var(--fd); letter-spacing: 0.06em; text-transform: uppercase; }
.cti-secret { color: var(--danger); font: 700 18px/1.4 var(--fm); letter-spacing: 0.04em; }

/* ---------- camada da câmera sem recorte: card que sai da tela, colchetes, toque */
#popCard { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
#popCard .card { position: relative; left: 0; top: 0; }
#scanline { position: absolute; left: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(var(--found-rgb), 0.95), transparent); box-shadow: 0 0 18px 2px rgba(var(--found-rgb), 0.5); }
.brk { position: absolute; width: 24px; height: 24px; border: 0 solid rgba(var(--found-rgb), 0.95); }
.brk.tl { border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 7px; }
.brk.tr { border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 7px; }
.brk.bl { border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 7px; }
.brk.br { border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 7px; }
#tap { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, 0.26); border: 1.5px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); opacity: 0; }

/* ---------- assinatura */
#outro { position: absolute; inset: 0; }
#oGhost { position: absolute; left: 0; top: 0; width: 112px; height: 103px; }
#oGhost svg { width: 112px; height: 103px; }
#oWord { position: absolute; left: 0; top: 0; font: 700 100px/1 var(--fd); letter-spacing: -0.045em; color: var(--text); white-space: nowrap; }
#oDomain { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 500 24px/1 var(--fm); color: var(--text3); letter-spacing: 0.04em; }

#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, transparent 40%, rgba(0, 0, 0, 0.7) 100%); }
#grain { position: absolute; inset: -40px; opacity: 0.012; background-size: 256px 256px; }
#fade { position: absolute; inset: 0; background: var(--night); opacity: 0; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow" id="glowA"></div>
  <div class="glow" id="glowB"></div>
  <div id="world">
    <div id="cam">
      <div id="win">
        <div id="winBg"></div>
        <div id="main">
          <div id="content">
            <div id="sec">
              <div id="greet"><div id="ghost"></div><h1 class="search-title" id="title"><span class="w">Hello, </span><span class="w" data-tint>Hacker.</span></h1></div>
              <div id="sub"><p id="subP"></p></div>
              <div id="tabs"></div>
              <div id="srow">
                <div class="search-field" id="field">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                  <div class="q"><span class="ph" id="ph">email@example.com</span><span id="typed"></span><span id="caret"></span></div>
                </div>
                <div class="search-btn" id="go"><div id="goRing"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
              </div>
              <p id="terms">By searching, you agree to the <a>Terms of use</a>.</p>
              <div id="deepRow"><div id="deep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg><span>Deep search</span><div class="toggle-dot" id="tdot"><div class="toggle-knob" id="tknob"></div></div></div></div>
            </div>

            <div id="loading"><div class="spinner" id="spin"></div><span>Searching across multiple sources...</span><div class="loading-progress"><b id="lf">0</b> found &middot; <b id="lc">0</b> checked</div></div>
            <div id="reshead"><span class="results-query">marina.vale@example.com</span><span class="results-time">illustrative example</span></div>

            <div id="wallWrap"><div id="wall"><div id="beamTrail"></div><div id="beam"></div></div></div>

            <div id="panel"><div id="panelBox"></div>
              <div class="sources-header" id="panelHead"><span class="sources-title">Sources with results</span><span class="sources-count" id="pcount">0</span></div>
              <div class="sources-grid" id="pgrid"></div>
            </div>
            <div id="flyers"></div>
            <div id="cards"></div>
          </div>
          <div id="topbar"><div id="topbarBg"></div>
            <div id="mtBrand"><div id="mtLogo"></div><strong class="mt-name">Espectro<span>sint</span></strong></div>
            <div id="mtMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></div>
          </div>
          <div id="dim"></div>
        </div>
        <div id="sheen"></div>
        <div id="chat"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7.6l-4.6 3.4c-.5.4-1.2 0-1.2-.6V17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></div>
      </div>
      <div id="pop">
        <div id="popCard"></div>
        <div id="scanline"></div>
        <div class="brk tl" id="bTL"></div><div class="brk tr" id="bTR"></div><div class="brk bl" id="bBL"></div><div class="brk br" id="bBR"></div>
        <div id="tap"></div>
      </div>
    </div>
    <div id="outro">
      <div id="oGhost"></div>
      <div id="oWord"></div>
      <div id="oDomain">espectrosint.com</div>
    </div>
  </div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const SW = 1080, SH = 1920, CX = SW / 2, CY = SH / 2;   // palco vertical
const W = 430, H = 764, TOP = 60.4;                      // viewport do celular (px CSS) e altura do topo

function camAt(t) {
  const [fx, fy, s, rx, ry, rz] = L.cam.map((f) => f(t));
  return { fx: fx + 3 * Math.sin(t * 0.41), fy: fy + 4 * Math.sin(t * 0.53 + 0.7), s: s * (1 + 0.006 * Math.sin(t * 0.37)), rx: rx + 0.5 * Math.sin(t * 0.6), ry: ry + 0.7 * Math.sin(t * 0.45 + 1.3), rz: rz + 0.15 * Math.sin(t * 0.33) };
}
const press = (t, tc) => (t < tc ? 1 : 1 - 0.06 * Math.exp(-(t - tc) * 9) * Math.sin(Math.min(Math.PI, (t - tc) * 26)));

    p.el.style.filter = blurOf(crossed && p.found ? 0 : dof);
  });
  const beamOn = clamp((t - T.beam0 + 0.2) * 5) * (1 - prog(t, T.beam1 - 0.15, 0.25));
  $('#beam').style.width = `${L.wallW + 80}px`;
  $('#beam').style.transform = `translateY(${by.toFixed(2)}px)`;
  $('#beam').style.opacity = beamOn.toFixed(3);
  $('#beamTrail').style.width = `${L.wallW + 80}px`;
  $('#beamTrail').style.transform = `translateY(${(by - 240).toFixed(2)}px)`;
  $('#beamTrail').style.opacity = beamOn.toFixed(3);

  // 5 · fontes voam para o painel; cabeçalho de resultados
  focus($('#panelBox'), t, { in: T.panel, inD: 0.6, dy: 0, b0: 0 });
  const panel = $('#panel');
  panel.style.opacity = clamp((t - T.panel) * 4).toFixed(3);
  panel.style.filter = blurOf((1 - eOut4(prog(t, T.panel, 0.6))) * 10);
  focus($('#panelHead'), t, { in: T.panel + 0.1, inD: 0.6, dy: 8, b0: 6 });
  let landed = 0;
  L.flyers.forEach((el, i) => {
    const a = L.flyT[i], u = eInOut(prog(t, a, 0.72));
    const [x0, y0] = L.flyStart[i], [x1, y1] = L.slots[i];
    if (t >= a + 0.72) landed++;
    el.style.opacity = t >= a && t < a + 0.72 ? 1 : 0;
    const hl = 1 - eInOut(prog(t, a + 0.2, 0.5));
    el.style.borderColor = `rgba(132,204,22,${(0.65 * hl).toFixed(3)})`;
    el.style.boxShadow = `0 0 ${(20 * hl).toFixed(1)}px rgba(132,204,22,${(0.28 * hl).toFixed(3)})`;
    el.style.color = mixRGB(TEXT2, WHITE, hl);
    el.style.transform = `translate(${lerp(x0, x1, u).toFixed(2)}px, ${(lerp(y0, y1, u) - 40 * Math.sin(Math.PI * u)).toFixed(2)}px) scale(${lerp(WS, 1, u).toFixed(4)})`;
    L.ppills[i].style.opacity = t >= a + 0.72 ? 1 : 0;
  });
  $('#pcount').textContent = landed;
  focus($('#reshead'), t, { in: T.head, inD: 0.6, dy: 10, b0: 8 });

  // 6 · cards sobem em 3D; contadores; profundidade de campo
  const dofW = prog(t, T.dof0, 0.8) * (1 - prog(t, T.focus - 0.4, 0.5)) + prog(t, T.more + 0.5, 0.6) * (1 - prog(t, T.out + 0.3, 0.5));
  L.cards.forEach((c, i) => {
    const a = c.tin, p = eOut4(prog(t, a, 0.8)), sp = spring(t - a, 1.1, 0.82);
    const cyw = c.y + c.h / 2 - scroll, cxw = c.x + c.w / 2;
    const d = Math.hypot((cxw - C.fx) * C.s * 0.55, (cyw - C.fy) * C.s);
    const dof = dofW * clamp((d - 520) / 70, 0, 5);
    const hideLeak = i === LEAKI && t >= T.pop && t < T.unpop + 0.6 ? 0 : 1;
    c.el.style.opacity = (clamp((t - a) * 4) * hideLeak).toFixed(3);
    c.el.style.transform = `perspective(1300px) translateY(${(60 * (1 - sp)).toFixed(2)}px) rotateX(${(34 * (1 - sp)).toFixed(3)}deg) scale(${lerp(0.95, 1, p).toFixed(4)})`;
    c.el.style.filter = blurOf((1 - p) * 12 + dof);
    if (c.av) focus(c.av, t, { in: a + 0.15, inD: 0.6, dx: -12, dy: 0, b0: 8 });
    c.rows.forEach((r, j) => focus(r, t, { in: a + 0.22 + j * 0.07, inD: 0.55, dx: 14, dy: 0, b0: 5 }));
    if (c.open) focus(c.open, t, { in: a + 0.42, inD: 0.55, dy: 10, b0: 5 });
    c.counts.forEach((el) => { const v = +el.dataset.count; el.textContent = Math.round(v * eOut4(prog(t, a + 0.35, 1.0))).toLocaleString('en-US'); });
    c.el.style.backgroundPosition = `${50 + 30 * Math.sin(t * 0.14 + i)}% ${50 + 30 * Math.cos(t * 0.12 + i * 1.3)}%`;
  });

  // 7 · o card de vazamento sai da tela, colchetes de evidência fecham
  const lk = L.cards[LEAKI], pc = $('#popCard');
  const popIn = spring(t - T.pop, 1.1, 0.78), popOut = eInOut(prog(t, T.unpop, 0.6));
  const lift = popIn * (1 - popOut);
  const LZ = 90;
  const vis = t >= T.pop && t < T.unpop + 0.6;
  pc.style.display = vis ? 'block' : 'none';
  if (vis) {
    pc.style.transform = `translate(${lk.x}px, ${(lk.y - scroll).toFixed(2)}px) translateZ(${(LZ * lift).toFixed(2)}px) rotateY(${(-7 * lift).toFixed(3)}deg) rotateX(${(3 * lift).toFixed(3)}deg)`;
    const pl = $('#popLeak');
    pl.style.boxShadow = `0 0 0 1px rgba(220,38,38,${(0.22 + 0.3 * lift).toFixed(3)}), 0 ${(8 + 40 * lift).toFixed(1)}px ${(28 + 70 * lift).toFixed(1)}px rgba(220,38,38,${(0.1 + 0.22 * lift).toFixed(3)}), 0 ${(30 * lift).toFixed(1)}px ${(90 * lift).toFixed(1)}px rgba(0,0,0,${(0.6 * lift).toFixed(3)})`;
  }
  $('#dim').style.opacity = (0.5 * lift).toFixed(3);
  $('#main').style.filter = blurOf(2.5 * lift);
  const bk = spring(t - T.pop - 0.25, 1.6, 0.7) * (1 - eIn3(prog(t, T.unpop - 0.1, 0.35)));
  const pad = lerp(44, 12, clamp(bk)), bz = LZ * lift + 2;
  const bx0 = lk.x - pad, by0 = lk.y - scroll - pad, bx1 = lk.x + lk.w + pad - 24, by1 = lk.y - scroll + lk.h + pad - 24;
  [['#bTL', bx0, by0], ['#bTR', bx1, by0], ['#bBL', bx0, by1], ['#bBR', bx1, by1]].forEach(([id, x, y]) => {
    const el = $(id);
    el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) translateZ(${bz.toFixed(2)}px) rotateY(${(-7 * lift).toFixed(3)}deg)`;
    el.style.opacity = (clamp(bk * 1.4) * (t > T.pop ? 1 : 0)).toFixed(3);
  });
  const sl = prog(t, T.pop + 0.35, 0.9);
  const scan = $('#scanline');
  scan.style.width = `${lk.w}px`;
  scan.style.transform = `translate(${lk.x}px, ${(lk.y - scroll + lk.h * sl).toFixed(2)}px) translateZ(${(LZ * lift + 1).toFixed(2)}px) rotateY(${(-7 * lift).toFixed(3)}deg)`;
  scan.style.opacity = (sl > 0 && sl < 1 ? Math.sin(Math.PI * sl) : 0).toFixed(3);

  // toque: aparece 0,16 s antes, afunda ao pressionar, abre sumindo (segue a rolagem)
  let tOp = 0, tSc = 1, tx = 0, ty = 0;
  L.taps.forEach(([tc, x, y]) => {
    const a = tc - 0.16;
    if (t < a || t > tc + 0.55) return;
    const inP = eOut3(prog(t, a, 0.12));
    const rel = eOut3(prog(t, tc + 0.1, 0.4));
    const sink = Math.sin(Math.PI * prog(t, tc - 0.03, 0.2));
    tOp = inP * (1 - rel);
    tSc = lerp(1.22, 1, inP) * (1 - 0.14 * sink) * lerp(1, 1.65, rel);
    tx = x; ty = y - scroll;
  });
  $('#tap').style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) translateZ(3px) scale(${tSc.toFixed(4)})`;
  $('#tap').style.opacity = tOp.toFixed(3);

  // 8 · assinatura: fantasma cai, desliza, nome letra a letra, domínio
  const og = $('#oGhost'), ow = $('#oWord'), od = $('#oDomain');
  $('#outro').style.transform = `scale(${(1 + 0.035 * eInOut(prog(t, T.logo, DURATION - T.logo))).toFixed(5)})`;
  const GW = 112, GAP = 34, WT = CY - 55;
  const tot = GW + GAP + ow.offsetWidth;
  const s8 = eInOut(prog(t, T.logo + 0.62, 0.6));
  const pop8 = spring(t - T.logo, 1.3, 0.8);
  const gx = CX - GW / 2 + lerp(0, -(tot / 2 - GW / 2), s8);
  og.style.transform = `translate(${gx.toFixed(2)}px, ${(WT - 5 + (1 - pop8) * -260).toFixed(2)}px) scale(${lerp(0.55, 1, pop8).toFixed(4)})`;
  og.style.filter = blurOf((1 - eOut4(prog(t, T.logo, 0.7))) * 22);
  og.style.opacity = clamp((t - T.logo) * 4).toFixed(3);
  ow.style.left = `${CX - tot / 2 + GW + GAP}px`;
  ow.style.top = `${WT}px`;
  $$('.w', ow).forEach((w, i) => focus(w, t, { in: T.logo + 0.7 + i * 0.055, inD: 0.6, dx: 26, dy: 0, b0: 12 }));
  od.style.top = `${WT + 152}px`;
  focus(od, t, { in: T.logo + 1.55, inD: 0.9, dy: 10, b0: 8 });
}
window.renderAt = render;
window.DURATION = DURATION;

const capture = new URLSearchParams(location.search).has('capture');
function fit() {
  const s = capture ? 1 : Math.min(innerWidth / SW, innerHeight / SH);
  const st = $('#stage');
  st.style.transform = `scale(${s})`;
  st.style.left = capture ? '0' : `${(innerWidth - SW * s) / 2}px`;
  st.style.top = capture ? '0' : `${(innerHeight - SH * s) / 2}px`;
}
addEventListener('resize', fit); fit();
if (!capture) {
  const t0 = performance.now();
  const loop = (now) => { render(((now - t0) / 1000) % (DURATION + 0.5)); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
